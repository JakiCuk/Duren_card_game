name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Random-play fuzzer over the engine invariants. Cheap enough per PR, and
      # it is the only check that reaches genuinely odd board states.
      - run: pnpm sim -- --games 4000 --players 2
      - run: pnpm sim -- --games 2000 --players 4 --deck 52 --seed 500000
      # Bots drive the same driver, so this fuzzes the redaction path and the
      # policies together.
      - run: pnpm sim -- --games 1500 --bots 2,1
      - run: pnpm sim -- --games 800 --bots 2,1,2
      # Random house-rule combinations. This is the check that found both the
      # transfer/cap hole and the position that never terminated.
      - run: pnpm sim -- --games 3000 --matrix true --seed 111000
      - run: pnpm sim -- --games 1200 --matrix true --bots 2,1 --seed 222000
      - run: pnpm build

  # The strength ladder is slow (level 4 samples 64 deals per decision), so it
  # runs on a schedule rather than blocking every pull request.
  ladder:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench -- --games 800
